# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Hỏi lại người dùng khi chưa đủ điều kiện để hành động. Dùng trong hai tình huống:
      (1) xin xác nhận yes/no trước một hành động gửi/đăng/publish ra ngoài;
      (2) hỏi một giá trị bắt buộc còn thiếu (tài khoản, URL, chủ đề).
      Nếu yêu cầu vừa là hành động publish vừa thiếu nội dung thì tình huống (1) thắng:
      xin xác nhận trước, không hỏi nội dung trước.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: >-
            LUÔN ghi rõ trường này, không bao giờ bỏ trống.
            yes_no = xin xác nhận cho hành động gửi/đăng/publish (kể cả khi nội dung còn thiếu).
            text = hỏi một giá trị còn thiếu như screenname hoặc URL.
            choice = đưa danh sách lựa chọn cố định.
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Team tools (custom) ----------------
  - name: policy_deep_search
    description: >-
      Tìm trong tài liệu nội bộ VinUni (company_policy), giống policy nhưng chia nhỏ theo
      đoạn văn thay vì cắt cứng 1000 ký tự — dùng khi cần trích một đoạn/điều khoản cụ thể
      trong văn bản dài, hoặc khi policy trả kết quả rỗng/thiếu cho một tài liệu không có
      heading "## ".
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, general_policy, admissions_policy, it_usage_policy, student_services, student_conduct, tuition_fees, scholarship_policy, research_policy, grading_policy, academic_integrity, library_policy, attendance_policy, ai_research, source_citation, external_publishing, data_privacy, tool_usage], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 5, description: "Số đoạn trả về"}
        max_chars: {type: integer, default: 800, description: "Độ dài tối đa mỗi đoạn (ký tự)"}
      required: [query]

  - name: policy_semantic_search
    description: >-
      Tìm trong tài liệu nội bộ VinUni bằng xếp hạng TF-IDF/cosine similarity thay vì khớp
      từ khóa thuần. Ưu tiên dùng khi câu hỏi diễn đạt khác từ khóa gốc trong tài liệu
      (đồng nghĩa, viết lại) và policy/policy_deep_search có thể trả về rỗng.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, general_policy, admissions_policy, it_usage_policy, student_services, student_conduct, tuition_fees, scholarship_policy, research_policy, grading_policy, academic_integrity, library_policy, attendance_policy, ai_research, source_citation, external_publishing, data_privacy, tool_usage], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 5, description: "Số kết quả trả về"}
      required: [query]

  - name: policy_deadline
    description: >-
      Trích ngày/hạn chót dạng có cấu trúc (date_text, iso_start, iso_end, event) từ các
      tài liệu lịch/hạn chót nội bộ (academic calendar, admission deadlines). Dùng cho câu
      hỏi kiểu "khi nào hạn nộp hồ sơ" thay vì trả nguyên đoạn văn bản dài.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa lọc sự kiện (để trống = liệt kê tất cả)"}
        top_k: {type: integer, default: 15, description: "Số sự kiện trả về"}
      required: []

  - name: policy_compare
    description: >-
      So sánh nội dung giữa hai nhóm policy_area hoặc hai doc_id cụ thể, trả kết quả hai
      bên song song. Dùng khi câu hỏi nằm ở vùng chồng lấn giữa hai nhóm (vd học bổng xuất
      hiện cả ở tuition_fees và scholarship_policy) và không chắc nên tra ở đâu.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn (để trống = liệt kê nội dung nổi bật mỗi bên)"}
        area_a: {type: string, default: "", description: "policy_area hoặc doc_id thứ nhất"}
        area_b: {type: string, default: "", description: "policy_area hoặc doc_id thứ hai"}
        top_k: {type: integer, default: 3, description: "Số kết quả mỗi bên"}
      required: [area_a, area_b]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      ACTION tool: đăng văn bản ra Telegram channel công khai bên ngoài cuộc hội thoại.
      Đây KHÔNG phải cách trả lời người dùng — muốn trả lời thì viết thẳng, đừng gọi tool này.
      Confirmation boundary: mọi yêu cầu gửi/đăng/publish đều phải xin xác nhận bằng
      clarify(response_type="yes_no") TRƯỚC, kể cả khi nội dung cần gửi còn thiếu hoặc chưa rõ.
      Quy tắc xác nhận này ưu tiên cao hơn quy tắc hỏi lại thông tin thiếu: hỏi "có đăng không?"
      trước, không hỏi "nội dung là gì?". Chỉ gọi send sau khi người dùng đã đồng ý rõ ràng.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung sẽ đăng công khai"}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt true sau khi người dùng đã trả lời đồng ý cho câu clarify(yes_no). Không bao giờ tự đặt true."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area:
          type: string
          enum: [all, academic_integrity, student_conduct, academic_regulations, graduation,
                 ai_research, source_citation, data_privacy, external_publishing, tool_usage]
          default: "all"
          description: >-
            Nhóm quy định cần tra. Quy chế VinUni: academic_integrity (liêm chính học thuật, đạo văn,
            gian lận), student_conduct (nội quy, quyền và nghĩa vụ, hành vi bị cấm, kỷ luật),
            academic_regulations (học vụ: đăng ký học phần, điểm, GPA, thi, nghỉ học),
            graduation (xét tốt nghiệp, cấp bằng, bảng điểm).
            Dùng "all" khi chưa chắc thuộc nhóm nào.
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
