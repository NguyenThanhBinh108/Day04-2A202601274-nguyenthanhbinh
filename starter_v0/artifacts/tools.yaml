# starter_v0 — tool declarations (optimized v2+).
# Descriptions include: when to use, when NOT to use, arg conventions.
# send confirmation boundary is explicit.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Ask the user a clarifying question when information is missing or confirmation is needed.
      Use when: user asks for someone's tweets but provides no Twitter handle; user says "this article/post/link" with no URL;
      user wants to send/publish/post anything (MUST ask yes_no confirmation before any send action).
      Use response_type="text" to ask open-ended questions. Use response_type="yes_no" before any irreversible action (send, publish).
      Do NOT use this when you already have all the information needed.
    parameters:
      type: object
      properties:
        question: {type: string, description: "The clarifying question to ask the user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text=open answer; yes_no=confirmation before action; choice=select from options"}
        options: {type: array, default: [], items: {type: string}, description: "Options list (only for response_type=choice)"}
      required: [question]

  - name: timeline
    description: >
      Fetch recent posts/tweets FROM a specific Twitter/X user account.
      Use when: user asks for tweets OF a named person (e.g. "tweet của Sam Altman" → screenname="sama").
      Do NOT use when: user asks about a topic (use social_search instead).
      Handle mapping: Sam Altman→sama, Elon Musk→elonmusk, Andrej Karpathy→karpathy, Yann LeCun→ylecun, Jensen Huang→jensenhuang.
      If you do not know the handle, call clarify to ask — never invent a handle.
    parameters:
      type: object
      properties:
        screenname: {type: string, description: "Twitter/X handle WITHOUT the @ symbol (e.g. 'sama', 'elonmusk')"}
        limit: {type: integer, default: 5, description: "Number of tweets to fetch (use exact number if user specifies)"}
      required: [screenname]

  - name: social_search
    description: >
      Search Twitter/X for posts matching a keyword or topic query.
      Use when: user asks what people are saying about a topic, trend, or keyword on social media/Twitter.
      Do NOT use when: user asks for tweets FROM a specific person (use timeline instead).
      Do NOT use when: user wants web news/articles (use lookup instead).
      search_type convention: "phổ biến/top/trending/nổi bật" → Top; default or "mới nhất/latest" → Latest.
    parameters:
      type: object
      properties:
        query: {type: string, description: "Search keyword or phrase"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest=newest tweets; Top=most popular/engagement tweets"}
        limit: {type: integer, default: 5, description: "Number of results"}
      required: [query]

  - name: lookup
    description: >
      Search the WEB (NOT Twitter/social media) for news articles, blog posts, or general information.
      Use when: user asks for news, recent events, web articles, general research.
      Do NOT use when: user asks about tweets/posts (use social_search or timeline instead).
      Do NOT use when: user already provides a specific URL (use fetch instead).
      topic convention: "tin tức/news/hôm nay/tuần này" → topic=news; general research → topic=general.
      timeframe convention: "hôm nay/today" → day; "tuần này/this week" → week; "tháng này/this month" → month; default → week.
    parameters:
      type: object
      properties:
        query: {type: string, description: "Search query (e.g. 'AI news', 'robotics')"}
        topic: {type: string, enum: [general, news], default: "general", description: "news=for current events/news articles; general=for any web search"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=today; week=this week; month=this month; year=this year"}
        max_results: {type: integer, default: 5, description: "Number of results to return"}
      required: [query]

  - name: fetch
    description: >
      Read and extract the full text content of a specific URL.
      Use when: user provides an explicit URL and wants it summarized or read.
      Do NOT use when: no URL is given (call clarify to ask for the URL first).
      Do NOT use when: user just wants to search the web (use lookup instead).
    parameters:
      type: object
      properties:
        url: {type: string, description: "The full URL to fetch (must start with http:// or https://)"}
      required: [url]

  - name: format
    description: >
      Format and present a list of already-collected items as a structured markdown digest.
      Use when: you have collected items from lookup/social_search/timeline and need to present them nicely.
      Do NOT use this to collect new data — fetch/search first, then format.
      template convention: "brief"=short summary; "sections"=grouped by topic; "bullets"=simple list; "thread"=Twitter thread style; "daily_ai_vn"=Vietnamese daily AI digest.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "List of items to format (each item should have title, url, source, summary)"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output format template"}
        headline: {type: string, default: "", description: "Optional headline/title for the digest"}
      required: [items, template]

  # ---------------- Team tools (custom) ----------------
  - name: policy_deep_search
    description: >-
      Tìm trong tài liệu nội bộ VinUni (company_policy), giống policy nhưng chia nhỏ theo
      đoạn văn thay vì cắt cứng 1000 ký tự — dùng khi cần trích một đoạn/điều khoản cụ thể
      trong văn bản dài, hoặc khi policy trả kết quả rỗng/thiếu cho một tài liệu không có
      heading "## ".
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, general_policy, admissions_policy, it_usage_policy, student_services, student_conduct, tuition_fees, scholarship_policy, research_policy, grading_policy, academic_integrity, library_policy, attendance_policy, ai_research, source_citation, external_publishing, data_privacy, tool_usage], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 5, description: "Số đoạn trả về"}
        max_chars: {type: integer, default: 800, description: "Độ dài tối đa mỗi đoạn (ký tự)"}
      required: [query]

  - name: policy_semantic_search
    description: >-
      Tìm trong tài liệu nội bộ VinUni bằng xếp hạng TF-IDF/cosine similarity thay vì khớp
      từ khóa thuần. Ưu tiên dùng khi câu hỏi diễn đạt khác từ khóa gốc trong tài liệu
      (đồng nghĩa, viết lại) và policy/policy_deep_search có thể trả về rỗng.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, general_policy, admissions_policy, it_usage_policy, student_services, student_conduct, tuition_fees, scholarship_policy, research_policy, grading_policy, academic_integrity, library_policy, attendance_policy, ai_research, source_citation, external_publishing, data_privacy, tool_usage], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 5, description: "Số kết quả trả về"}
      required: [query]

  - name: policy_deadline
    description: >-
      Trích ngày/hạn chót dạng có cấu trúc (date_text, iso_start, iso_end, event) từ các
      tài liệu lịch/hạn chót nội bộ (academic calendar, admission deadlines). Dùng cho câu
      hỏi kiểu "khi nào hạn nộp hồ sơ" thay vì trả nguyên đoạn văn bản dài.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa lọc sự kiện (để trống = liệt kê tất cả)"}
        top_k: {type: integer, default: 15, description: "Số sự kiện trả về"}
      required: []

  - name: policy_compare
    description: >-
      So sánh nội dung giữa hai nhóm policy_area hoặc hai doc_id cụ thể, trả kết quả hai
      bên song song. Dùng khi câu hỏi nằm ở vùng chồng lấn giữa hai nhóm (vd học bổng xuất
      hiện cả ở tuition_fees và scholarship_policy) và không chắc nên tra ở đâu.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn (để trống = liệt kê nội dung nổi bật mỗi bên)"}
        area_a: {type: string, default: "", description: "policy_area hoặc doc_id thứ nhất"}
        area_b: {type: string, default: "", description: "policy_area hoặc doc_id thứ hai"}
        top_k: {type: integer, default: 3, description: "Số kết quả mỗi bên"}
      required: [area_a, area_b]

  - name: weather
    description: >
      Get current weather and forecast for any city or location worldwide.
      Use when: user asks about weather, temperature, rain, humidity, wind for a specific place.
      Do NOT use for historical weather data. Do NOT use if no location is mentioned (call clarify first).
      Supports city names in Vietnamese and English (e.g. "Hà Nội", "Ho Chi Minh City", "Hanoi", "Paris").
    parameters:
      type: object
      properties:
        location: {type: string, description: "City or place name (e.g. 'Hanoi', 'Hà Nội', 'Ho Chi Minh City')"}
        days: {type: integer, default: 1, description: "Number of forecast days (1=today only, 3=3-day forecast, max 7)"}
      required: [location]

  # ---------------- Optional/Advanced tools ----------------
  - name: send
    description: >
      Send a text message to the Telegram channel. THIS IS AN IRREVERSIBLE ACTION.
      BEFORE calling this tool, you MUST first call clarify(response_type="yes_no") to ask the user for confirmation.
      Only call send AFTER the user explicitly confirms (confirmed=true).
      Do NOT call send automatically without prior confirmation — this is a hard rule.
    parameters:
      type: object
      properties:
        text: {type: string, description: "The message text to send to Telegram"}
        confirmed: {type: boolean, default: false, description: "Must be true — only set after user explicitly confirmed via clarify(yes_no)"}
      required: [text]

  - name: policy
    description: >
      Search VinUniversity internal policy documents for rules, regulations, and guidelines.
      Use when: user asks about VinUni academic policy, attendance, grading, scholarships, conduct, admissions, IT policy.
      Do NOT use for general web search (use lookup instead).
      policy_area values: academic_integrity, grading_policy, student_conduct, attendance_policy, tuition_fees, scholarship_policy, admissions_policy, research_policy, it_usage_policy, library_policy, student_services, general_policy.
    parameters:
      type: object
      properties:
        query: {type: string, description: "Policy search query (e.g. 'đạo văn Tier 3', 'học phí 2024', 'dùng ChatGPT làm bài')"}
        policy_area: {type: string, enum: [all, academic_integrity, grading_policy, student_conduct, attendance_policy, tuition_fees, scholarship_policy, admissions_policy, research_policy, it_usage_policy, library_policy, student_services, general_policy], default: "all", description: "Filter by policy area; use 'all' if unsure"}
        top_k: {type: integer, default: 3, description: "Number of matching policy sections to return"}
      required: [query]

  - name: papers
    description: >
      Search arXiv for academic research papers on a scientific topic.
      Use when: user asks for research papers, academic literature, scientific studies.
      Do NOT use for general news (use lookup instead).
    parameters:
      type: object
      properties:
        query: {type: string, description: "Research topic or keywords (e.g. 'large language models', 'multimodal AI')"}
        max_results: {type: integer, default: 5, description: "Number of papers to return"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order: relevance=best match; lastUpdatedDate=recently updated; submittedDate=newest submitted"}
      required: [query]

  - name: paper_text
    description: >
      Download and extract the full text from an arXiv paper PDF.
      Use when: user wants to read the content of a specific arXiv paper (provide arXiv URL or ID like '2301.07600').
      Use after papers tool to get full content of a specific paper.
      Do NOT use for non-arXiv URLs (use fetch instead).
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, description: "arXiv paper URL (e.g. 'https://arxiv.org/abs/2301.07600') or paper ID (e.g. '2301.07600')"}
        max_pages: {type: integer, default: 5, description: "Maximum pages to extract"}
        max_chars: {type: integer, default: 8000, description: "Maximum characters to return"}
      required: [arxiv_url]
